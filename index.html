<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<meta name="description" content="执业药师《中药二》单味药 药名↔功效 互记游戏 · 407 味">
<title>中药二 · 药名功效互记</title>
<style>
  :root{
    --bg:#0f1420; --panel:#171e2e; --panel2:#1e2739; --line:#2b3651;
    --txt:#e8eefc; --dim:#8b9bb8; --acc:#7c5cff; --acc2:#2fd3a0;
    --ok:#2fd3a0; --bad:#ff5d6c; --warn:#ffb648;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:radial-gradient(1200px 700px at 50% -10%,#231b40 0%,var(--bg) 55%);
    color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;justify-content:center;align-items:flex-start;
    padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
  }
  #app{width:100%;max-width:560px;min-width:0}
  @media (max-width:430px){
    body{padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
    .drug{font-size:34px;letter-spacing:2px}
    .stat b{font-size:15px} .stat span{font-size:9.5px}
    .stats{gap:6px} .stat{padding:8px 5px}
    .card{padding:18px 14px 14px;border-radius:15px}
    .opt{padding:12px;font-size:13.5px}
    .io .btn{font-size:11.5px;padding:9px 2px}
  }

  .topbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .title{font-size:15px;font-weight:700;letter-spacing:.5px;flex:1;min-width:130px}
  .title small{display:block;font-weight:400;font-size:11px;color:var(--dim);letter-spacing:0}
  .btn{
    background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    padding:7px 12px;border-radius:9px;font-size:12.5px;cursor:pointer;transition:.15s;
    font-family:inherit;white-space:nowrap;
  }
  .btn:hover{background:#26314a;border-color:#3d4b6d}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:transparent}
  .btn.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}

  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 8px;text-align:center;min-width:0;overflow:hidden}
  .stat b{display:block;font-size:17px;line-height:1.25;font-variant-numeric:tabular-nums;white-space:nowrap}
  .stat span{font-size:10.5px;color:var(--dim)}
  .stat.a b{color:var(--acc2)} .stat.b b{color:var(--warn)} .stat.c b{color:var(--bad)}

  .bar{height:5px;background:#232d43;border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s}

  .card{
    background:linear-gradient(180deg,var(--panel),#141b2a);
    border:1px solid var(--line);border-radius:18px;padding:22px 18px 18px;
    box-shadow:0 18px 50px -28px #000;
  }
  .qmeta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);margin-bottom:14px}
  .qmeta .tm{font-variant-numeric:tabular-nums}
    background:rgba(124,92,255,.18);color:#b9a8ff;margin-right:6px}

  .drug{text-align:center;font-size:44px;font-weight:800;letter-spacing:3px;margin:6px 0 4px;line-height:1.2}
  .drug.long{font-size:34px;letter-spacing:2px}
  .ask{text-align:center;color:var(--dim);font-size:12.5px;margin-bottom:18px}

  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{
    display:flex;align-items:flex-start;gap:11px;
    background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;
    padding:13px 14px;font-size:14.5px;cursor:pointer;transition:.13s;text-align:left;
    color:var(--txt);font-family:inherit;width:100%;line-height:1.5;
  }
  .opt:hover:not(.lock){border-color:#46587f;background:#242f47}
  .opt .k{
    flex:0 0 24px;height:24px;border-radius:7px;background:#2c3855;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;color:#a9bade;margin-top:1px;
  }
  .opt .t{flex:1;min-width:0}
  .opt.lock{cursor:default}
  .opt.ok{border-color:var(--ok);background:rgba(47,211,160,.13)}
  .opt.ok .k{background:var(--ok);color:#06251c}
  .opt.bad{border-color:var(--bad);background:rgba(255,93,108,.13)}
  .opt.bad .k{background:var(--bad);color:#2b0004}
  .opt.dim{opacity:.42}

  .fb{margin-top:15px;font-size:13px;line-height:1.65;display:none}
  .fb.show{display:block;animation:fade .22s}
  @keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .fb .h{font-weight:700;font-size:14.5px;margin-bottom:6px}
  .fb .h.ok{color:var(--ok)} .fb .h.bad{color:var(--bad)}
  .fb .row{color:var(--dim);margin-top:3px}
  .fb .row b{color:var(--txt);font-weight:600}
  .fb .box{
    margin-top:9px;padding:10px 12px;background:#131a29;border-left:2.5px solid var(--acc);
    border-radius:0 8px 8px 0;color:#c6d3ee;font-size:12.5px;line-height:1.7
  }
  .fb .box i{color:var(--dim);font-style:normal;font-size:11px;display:block;margin-bottom:2px}
  .combo{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:99px;
    background:linear-gradient(90deg,#ffb648,#ff7a45);color:#2b1400;font-size:11px;font-weight:800;
    animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .wbar{display:flex;align-items:center;gap:8px;margin-top:11px}
  .wtag{font-size:10.5px;color:var(--dim);flex:0 0 auto}
  .wtrack{flex:1 1 auto;min-width:0;height:6px;background:#232d43;border-radius:99px;overflow:hidden}
  .wtrack>i{display:block;height:100%;border-radius:99px;
    background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .35s cubic-bezier(.2,.8,.2,1)}
  .wtrack>i.hi{background:linear-gradient(90deg,#2fd3a0,#7bea5e)}
  .wlab{flex:0 0 auto;font-size:10.5px;color:var(--dim);min-width:44px;text-align:right}
  .wlab.hi{color:var(--ok);font-weight:700}

  .next{margin-top:16px;width:100%;padding:13px;border-radius:12px;border:0;cursor:pointer;
    background:linear-gradient(90deg,var(--acc),#b06bff);color:#fff;font-size:15px;font-weight:700;
    font-family:inherit;display:none}
  .next.show{display:block;animation:fade .2s}
  .next:active{transform:scale(.985)}

  .io{display:flex;gap:8px;margin-top:14px}
  .io .btn{flex:1 1 0;min-width:0;font-size:12.5px;padding:9px 6px;overflow:hidden;text-overflow:ellipsis}
  .savehint{font-size:11px;color:#5f6d8c;margin-top:8px;text-align:center;line-height:1.6}
  .kbd{background:#2c3855;border-radius:5px;padding:1px 6px;font-size:11.5px;color:#b9c8e8}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:var(--acc2);color:#06251c;font-size:13px;font-weight:600;padding:10px 20px;
    border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .sc{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .sc>summary{cursor:pointer;padding:11px 14px;font-size:12.5px;color:var(--dim);list-style:none;
    display:flex;align-items:center;gap:6px;user-select:none}
  .sc>summary::-webkit-details-marker{display:none}
  .sc>summary:before{content:'▸';font-size:11px;transition:.2s;color:#5f6d8c}
  .sc[open]>summary:before{transform:rotate(90deg)}
  .scin{padding:2px 14px 12px}
  .sf{margin-bottom:9px}
  .sf label{display:block;font-size:10.5px;color:var(--dim);margin-bottom:3px}
  .sf input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);
    background:#131a29;color:var(--txt);font-size:12.5px;font-family:inherit}
  .sf input:focus{outline:none;border-color:var(--acc)}
  .sbtns{display:flex;gap:7px;margin-top:10px}
  .sbtns .btn{flex:1;font-size:12px;padding:8px 4px}
  .smsg{font-size:11px;margin-top:9px;line-height:1.6;color:var(--dim)}
  .smsg.ok{color:var(--ok)} .smsg.err{color:var(--bad)}
  .sbadge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;
    background:#2c3855;color:#a9bade;font-weight:600}
  .sbadge.on{background:rgba(47,211,160,.18);color:var(--ok)}
  .sbadge.err{background:rgba(255,93,108,.18);color:var(--bad)}
  .sbadge.syncing{background:rgba(255,182,72,.18);color:var(--warn)}

  footer{margin-top:18px;text-align:center;font-size:11px;color:#556181;line-height:1.7}
</style>
</head>

<div id="app"></div>
<div class="toast" id="toast"></div>

/* 同功效组：g 字段是组内药名用 | 连接；空表示唯一 */
function sameGroup(a, b){
  if(!a.g || !b.g) return false;
  return a.g === b.g;
}

/* ---------- 存储 ---------- */
function parseState(raw){
  if(!raw) return null;
  try{ const o = JSON.parse(raw); return (o && o.cards) ? o : null; }catch(e){ return null; }
}
function load(){
  return parseState(localStorage.getItem(LS)) || parseState(localStorage.getItem(LS_BAK));
}
function save(){
  try{
    const s = JSON.stringify(state);
    localStorage.setItem(LS, s); localStorage.setItem(LS_BAK, s);
  }catch(e){}
}

let state = load() || {
  cards:{}, total:0, right:0, streak:0, streakBest:0, startAt:Date.now()
};
DRUGS.forEach(d => { if(!state.cards[d.n]) state.cards[d.n] = {w:2.5,n:0,c:0,t:0,last:0,streak:0}; });

const $ = s => document.querySelector(s);
const pct = (a,b) => b ? Math.round(a/b*100) : 0;
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function toast(msg){ const t=$('#toast'); if(!t) return; t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._i); toast._i=setTimeout(()=>t.classList.remove('show'),1700); }

let cur = null, answered = false, timerId = null;

/* ---------- 抽题：加权 ---------- */
function pickDrug(){
  const pool = DRUGS.filter(d => state.cards[d.n].w > MASTER);
  const src = pool.length ? pool : DRUGS;
  let sum = 0;
  const ws = src.map(d => { const w = Math.max(state.cards[d.n].w, 0.01); sum += w; return w; });
  let r = Math.random() * sum;
  for(let i=0;i<src.length;i++){ r -= ws[i]; if(r <= 0) return src[i]; }
  return src[src.length-1];
}

/* ---------- 构造选项（仅 A 型：给功效选药） ----------
   4 个选项都是"功效"，正确答案是本药的功效。
   干扰项来自功效不同的其他药，且所有功效文本互不相同，
   同功效组（大蓟/小蓟 等）绝不与本体同时出现。 */
function buildOptions(drug){
  const picked = [drug];
  const pool = DRUGS.filter(x => x.n !== drug.n && !sameGroup(x, drug));
  // 优先同章（更难），再用他章补足
  const sameChap = shuffle(pool.filter(x => x.c === drug.c));
  const otherChap = shuffle(pool.filter(x => x.c !== drug.c));

  const usedEff = new Set([drug.e]);
  for(const cand of sameChap.concat(otherChap)){
    if(picked.length >= OPTS) break;
    if(usedEff.has(cand.e)) continue;    // 功效文字必须互不相同
    usedEff.add(cand.e);
    picked.push(cand);
  }
  return { items: shuffle(picked), correct: drug };
}

/* ---------- 出题 ---------- */
function nextQuestion(){
  answered = false;
  const drug = pickDrug();
  const { items } = buildOptions(drug);
  cur = { drug, items, t0: performance.now() };

  const optHtml = items.map((o,i) => `<button class="opt" data-i="${i}">
      <span class="k">${i+1}</span>
      <span class="t">${o.e}</span>
    </button>`).join('');

  const card = $('#card');
  card.innerHTML = `
    <div class="qmeta">
      <span>第 ${state.total+1} 题</span>
      <span class="tm" id="tm">0.0s</span>
    </div>
    <div class="drug ${drug.n.length>=4?'long':''}">${drug.n}</div>
    <div class="ask">下列哪项是它的功效？</div>
    <div class="opts" id="opts">${optHtml}</div>
    <div class="fb" id="fb"></div>
    <button class="next" id="next">下一题 →</button>
  `;
  card.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(parseInt(b.dataset.i,10)));
  $('#next').onclick = nextQuestion;

  clearInterval(timerId);
  timerId = setInterval(()=>{ const el=$('#tm'); if(el && !answered) el.textContent = ((performance.now()-cur.t0)/1000).toFixed(1)+'s'; }, 100);
}

/* ---------- 判题 ---------- */
function answer(idx){
  if(answered) return;
  answered = true;
  clearInterval(timerId);

  const elapsed = performance.now() - cur.t0;
  const sec = elapsed / 1000;
  const chosen = cur.items[idx];
  const isRight = chosen.n === cur.drug.n;
  const card = state.cards[cur.drug.n];

  /* 权重：快答重视，答错重罚，与章节关一致 */
  let delta, speedTag;
  if(isRight){
    if(sec <= 2.0){ delta = -1.10; speedTag='快'; }
    else if(sec <= 4.5){ delta = -0.62; speedTag='稳'; }
    else { delta = -0.28; speedTag='慢'; }
    delta -= Math.min(card.streak,4) * 0.16;
    card.streak++;
  }else{
    delta = 2.6 + (card.w <= 0.8 ? 1.2 : 0);
    card.streak = 0;
  }
  card.w = Math.min(MAXW, Math.max(0.05, card.w + delta));
  card.n++; card.t += elapsed; card.last = Date.now();
  if(isRight) card.c++;

  state.total++;
  if(isRight){ state.right++; state.streak++; state.streakBest = Math.max(state.streakBest, state.streak); }
  else state.streak = 0;
  save();
  if(SYNC.configured) SYNC.tick(state);

  /* 反馈 */
  const btns = document.querySelectorAll('.opt');
  btns.forEach((b,i)=>{
    b.classList.add('lock');
    const isThisRight = cur.items[i].n === cur.drug.n;
    if(isThisRight) b.classList.add('ok');
    else if(i === idx) b.classList.add('bad');
    else b.classList.add('dim');
  });

  const masteredNow = card.w <= MASTER;
  const dispW = card.w <= MASTER ? '已掌握' : card.w <= 1.2 ? '快记住了' : card.w <= 2.5 ? '还要练' : '重点复习';

  const fb = $('#fb');
  fb.className = 'fb show';
  fb.innerHTML = `
    <div class="h ${isRight?'ok':'bad'}">
      ${isRight ? '✓ 正确' : '✗ 正确答案：' + cur.drug.e}
      <span style="font-weight:400;color:#8b9bb8;font-size:12px">${sec.toFixed(1)}s · ${isRight?speedTag+'答':'错'}</span>
      ${state.streak>=3 && isRight ? `<span class="combo">连对 ${state.streak}</span>` : ''}
    </div>
    <div class="box"><i>${cur.drug.n}　${cur.drug.c} › ${cur.drug.s}</i>${cur.drug.e}</div>
    ${!isRight ? `<div class="row">你选的「${chosen.e}」是 <b>${chosen.n}</b> 的功效</div>` : ''}
    <div class="wbar">
      <span class="wtag">掌握度</span>
      <span class="wtrack"><i class="${masteredNow?'hi':''}" style="width:${Math.round((1-card.w/MAXW)*100)}%"></i></span>
      <span class="wlab ${masteredNow?'hi':''}">${dispW}</span>
    </div>
  `;
  const n = $('#next'); n.classList.add('show'); n.focus();
  updateStats();
}

function updateStats(){
  const c = state.cards;
  const done = DRUGS.filter(d=>c[d.n].n>0).length;
  const mastered = DRUGS.filter(d=>c[d.n].n>0 && c[d.n].w<=MASTER).length;
  const weak = DRUGS.filter(d=>c[d.n].n>0 && c[d.n].w>1.5).length;
  const st = document.querySelectorAll('.stat b');
  if(st.length===4){
    st[0].textContent = mastered; st[1].textContent = weak;
    st[2].innerHTML = done + '<i style="font-size:11px;color:#8b9bb8">/407</i>';
    st[3].textContent = pct(state.right,state.total)+'%';
  }
  const bar = document.querySelector('.bar>i');
  if(bar) bar.style.width = pct(mastered,DRUGS.length)+'%';
  const t = document.querySelector('.title small');
  if(t) t.textContent = `407 味 · 连对 ${state.streak} · 最高 ${state.streakBest}`;
}

function exportJSON(){
  const blob = new Blob([JSON.stringify(state)], {type:'application/json'});
  const a = document.createElement('a');
  const d = new Date(), p = n=>String(n).padStart(2,'0');
  a.href = URL.createObjectURL(blob);
  a.download = `中药二药名功效_进度_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.json`;

function importJSON(file){
  const r = new FileReader();
  r.onload = () => {
    const o = parseState(r.result);
    if(!o){ toast('文件无法识别'); return; }
    if(!confirm('导入将覆盖当前进度，继续？')) return;
    state = o;
    DRUGS.forEach(d => { if(!state.cards[d.n]) state.cards[d.n]={w:2.5,n:0,c:0,t:0,last:0,streak:0}; });
    save(); render(); toast('已导入');
  };
  r.readAsText(file);
}

/* =========================================================
   云同步（GitHub 仓库，与章节关同机制、同仓库、独立文件）
   ========================================================= */
const SYNC = (() => {
  const CFG_KEY = 'zy2_effect_sync_cfg';
  const DEFAULT_PATH = 'progress-effect.json';
  let cfg = null, status='off', lastErr='', pushing=false, pending=null;
  let sinceLastPush = 0, lastPushAt = 0;

  const loadCfg = () => { try{ cfg = JSON.parse(localStorage.getItem(CFG_KEY)||'null'); }catch(e){ cfg=null; } return cfg; };
  const saveCfg = c => { cfg = c; localStorage.setItem(CFG_KEY, JSON.stringify(c)); };
  const clearCfg = () => { localStorage.removeItem(CFG_KEY); cfg=null; status='off'; };
  const deviceId = () => {
    let id = localStorage.getItem('zy2_device_id');
    if(!id){ id='dev_'+Math.random().toString(36).slice(2,8); localStorage.setItem('zy2_device_id',id); }
    return id;
  };

  function mergeCards(local, remote){
    const out = {};
    const names = new Set([...Object.keys(local||{}), ...Object.keys(remote||{})]);
    names.forEach(n=>{
      const a=local&&local[n], b=remote&&remote[n];
      if(!a){ out[n]=b; return; }
      if(!b){ out[n]=a; return; }
      out[n] = {
        w:Math.max(a.w||0,b.w||0), n:Math.max(a.n||0,b.n||0), c:Math.max(a.c||0,b.c||0),
        t:Math.max(a.t||0,b.t||0), last:Math.max(a.last||0,b.last||0), streak:Math.max(a.streak||0,b.streak||0)
      };
    });
    return out;
  }

  async function pull(){
    if(!cfg) return null;
    const api = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}`;
    const headers = {'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
    if(cfg.token) headers['Authorization'] = 'Bearer '+cfg.token;
    try{
      const r = await fetch(api+'?ref='+encodeURIComponent(cfg.branch)+'&t='+Date.now(), {headers, cache:'no-store'});
      if(r.status === 404) return null;
      if(!r.ok) throw new Error('读取失败 HTTP '+r.status);
      const j = await r.json();
      const b64 = (j.content||'').replace(/\s/g,'');
      return JSON.parse(decodeURIComponent(escape(atob(b64))));
    }catch(e){ lastErr = e.message||String(e); return null; }
  }

  async function doPush(){
    if(!cfg) return false;
    const api = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}`;
    const headers = {'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json',
      'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'};
    try{
      let sha = null;
      const gr = await fetch(api+'?ref='+encodeURIComponent(cfg.branch), {headers, cache:'no-store'});
      if(gr.ok){ sha = (await gr.json()).sha; }
      else if(gr.status !== 404){ throw new Error('读取失败 HTTP '+gr.status); }

      const body = {
        cards: state.cards, total: state.total||0, right: state.right||0,
        streak: state.streak||0, streakBest: state.streakBest||0,
        device: deviceId(), updatedAt: new Date().toISOString()
      };
      const payload = {
        message: `progress(effect): ${state.total||0} 题 @${deviceId()}`,
        content: btoa(unescape(encodeURIComponent(JSON.stringify(body)))),
        branch: cfg.branch
      };
      if(sha) payload.sha = sha;
      const pr = await fetch(api, {method:'PUT', headers, body: JSON.stringify(payload)});
      if(!pr.ok) throw new Error('写入失败 HTTP '+pr.status);
      status='ok'; lastErr=''; return true;
    }catch(e){ status='error'; lastErr=e.message||String(e); return false; }
  }

  async function push(force){
    if(!cfg) return false;
    if(pushing && !force){ pending = true; return false; }
    pushing = true; status='syncing';
    const ok = await doPush();
    pushing = false;
    if(ok){ sinceLastPush = 0; lastPushAt = Date.now(); }
    if(pending && ok){ pending = null; setTimeout(()=>push(true), 400); }
    return ok;
  }

  function tick(){
    if(!cfg) return;
    sinceLastPush++;
    if(sinceLastPush >= 5 || Date.now()-lastPushAt >= 30000) push();
  }
  function flush(){ if(cfg) push(true); }

  return {
    get configured(){ return !!(cfg && cfg.owner && cfg.repo && cfg.token); },
    get status(){ return status; }, get error(){ return lastErr; }, get cfg(){ return cfg; },
    loadCfg, saveCfg, clearCfg, mergeCards, pull, push, tick, flush, deviceId,
    async verify(c){
      const r = await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}`, {
        headers:{'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
      });
      if(!r.ok) throw new Error('仓库无法访问 HTTP '+r.status);
      const j = await r.json();
      if(!j.permissions || !j.permissions.push) throw new Error('token 没有写入权限');
      return j;
    }
  };
})();

function updateSyncBadge(){
  const b = $('#syncBadge'); if(!b) return;
  b.className = 'sbadge';
  if(!SYNC.configured){ b.textContent = '云同步 · 未开启'; return; }
  const st = SYNC.status;
  if(st==='syncing'){ b.classList.add('syncing'); b.textContent='云同步 · 上传中…'; }
  else if(st==='error'){ b.classList.add('err'); b.textContent='云同步 · 出错'; }
  else { b.classList.add('on'); b.textContent='云同步 · 已连'; }
}

function renderSyncPanel(){
  const p = $('#syncPanel'); if(!p) return;
  const c = SYNC.cfg || {};
  if(SYNC.configured){
    p.innerHTML = `
      <div class="smsg ok">已连接：<b>${c.owner}/${c.repo}</b> › ${c.path}</div>
      <div class="sbtns">
        <button class="btn" id="syncNow">立即同步</button>
        <button class="btn" id="syncPull">拉取合并</button>
        <button class="btn ghost" id="syncOff">断开</button>
      </div>
      <div class="smsg" id="syncMsg"></div>`;
    $('#syncNow').onclick = async () => {
      const m=$('#syncMsg'); m.className='smsg'; m.textContent='上传中…';
      const ok = await SYNC.push(true);
      m.className='smsg '+(ok?'ok':'err');
      m.textContent = ok ? '✅ 已上传' : ('❌ '+SYNC.error);
      updateSyncBadge();
    };
    $('#syncPull').onclick = async () => {
      const m=$('#syncMsg'); m.className='smsg'; m.textContent='拉取中…';
      const r = await SYNC.pull();
      if(!r){ m.className='smsg err'; m.textContent='云端暂无数据'; return; }
      state.cards = SYNC.mergeCards(state.cards, r.cards||{});
      DRUGS.forEach(d=>{ if(!state.cards[d.n]) state.cards[d.n]={w:2.5,n:0,c:0,t:0,last:0,streak:0}; });
      state.total = Math.max(state.total||0, r.total||0);
      state.right = Math.max(state.right||0, r.right||0);
      save(); m.className='smsg ok'; m.textContent='✅ 已合并';
      await SYNC.push(true); render();
    };
    $('#syncOff').onclick = () => { if(confirm('断开云同步？本地进度保留。')){ SYNC.clearCfg(); render(); } };
  } else {
    p.innerHTML = `
      <div class="sf"><label>仓库所有者</label><input id="ghOwner" placeholder="hengkewuyou" value="${c.owner||''}"></div>
      <div class="sf"><label>仓库名</label><input id="ghRepo" placeholder="zy2-game1" value="${c.repo||''}"></div>
      <div class="sf"><label>Token（细粒度，Contents 读写）</label><input id="ghToken" type="password" placeholder="github_pat_..." value="${c.token||''}"></div>
      <div class="sf"><label>文件路径</label><input id="ghPath" value="${c.path||'progress-effect.json'}"></div>
      <div class="sbtns"><button class="btn" id="syncConnect">连接并同步</button></div>
      <div class="smsg" id="syncMsg"></div>
      <div style="font-size:10px;color:#556181;margin-top:8px;line-height:1.6">
        ⚠️ Token 会存在本浏览器。建议只给「本仓库 · Contents 读写」并设短有效期。
      </div>`;
    $('#syncConnect').onclick = async () => {
      const m = $('#syncMsg');
      const cfg = {
        owner: $('#ghOwner').value.trim(), repo: $('#ghRepo').value.trim(),
        token: $('#ghToken').value.trim(), branch: 'main',
        path: $('#ghPath').value.trim() || 'progress-effect.json'
      };
      if(!cfg.owner||!cfg.repo||!cfg.token){ m.className='smsg err'; m.textContent='三项都要填'; return; }
      m.className='smsg'; m.textContent='验证中…';
      try{
        await SYNC.verify(cfg); SYNC.saveCfg(cfg);
        m.className='smsg ok'; m.textContent='✅ 连接成功，拉取中…';
        const r = await SYNC.pull();
        if(r && r.cards){
          state.cards = SYNC.mergeCards(state.cards, r.cards);
          DRUGS.forEach(d=>{ if(!state.cards[d.n]) state.cards[d.n]={w:2.5,n:0,c:0,t:0,last:0,streak:0}; });
          state.total = Math.max(state.total||0, r.total||0);
          state.right = Math.max(state.right||0, r.right||0);
        }
        save(); await SYNC.push(true);
        setTimeout(()=>render(), 400);
      }catch(e){ m.className='smsg err'; m.textContent='❌ '+(e.message||e); }
    };
  }
  updateSyncBadge();
}

(async function boot(){
  SYNC.loadCfg();
  if(!SYNC.configured){ updateSyncBadge(); return; }
  try{
    const r = await SYNC.pull();
    if(r && r.cards){
      const before = JSON.stringify(state.cards);
      state.cards = SYNC.mergeCards(state.cards, r.cards);
      DRUGS.forEach(d=>{ if(!state.cards[d.n]) state.cards[d.n]={w:2.5,n:0,c:0,t:0,last:0,streak:0}; });
      state.total = Math.max(state.total||0, r.total||0);
      state.right = Math.max(state.right||0, r.right||0);
      state.streakBest = Math.max(state.streakBest||0, r.streakBest||0);
      if(JSON.stringify(state.cards) !== before){ save(); render(); }
    }
  }catch(e){}
  updateSyncBadge();
})();

document.addEventListener('visibilitychange', async () => {
  if(!SYNC.configured) return;
  if(document.visibilityState === 'hidden'){ SYNC.flush(); return; }
  try{
    const r = await SYNC.pull();
    if(!r || !r.cards) return;
    const before = JSON.stringify(state.cards);
    state.cards = SYNC.mergeCards(state.cards, r.cards);
    DRUGS.forEach(d=>{ if(!state.cards[d.n]) state.cards[d.n]={w:2.5,n:0,c:0,t:0,last:0,streak:0}; });
    state.total = Math.max(state.total||0, r.total||0);
    state.right = Math.max(state.right||0, r.right||0);
    if(JSON.stringify(state.cards) !== before){ save(); render(); }
  }catch(e){}
});
window.addEventListener('pagehide', ()=>{ if(SYNC.configured) SYNC.flush(); });
window.addEventListener('beforeunload', ()=>{ if(SYNC.configured) SYNC.flush(); });
</script>
</body>
